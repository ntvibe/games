<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7c8df" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Magic Makeup Studio</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game" class="game-shell" aria-label="Magic Makeup Studio">
    <div id="backdrop" class="backdrop backdrop-rose" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <header class="hud">
      <button id="backButton" class="hud-button" type="button" aria-label="Previous step">←</button>
      <div class="hud-copy">
        <div class="eyebrow-row">
          <span id="categoryName" class="category-name">Face</span>
          <span id="stepCounter" class="step-counter">1 / 18</span>
        </div>
        <h1 id="stepTitle">Foundation</h1>
        <p id="stepHint">Choose a shade, then sweep the brush over the face.</p>
      </div>
      <button id="fullscreenButton" class="hud-button" type="button" aria-label="Toggle fullscreen">⛶</button>
    </header>

    <div id="categoryRail" class="category-rail" aria-label="Makeover progress"></div>

    <section id="playfield" class="playfield" aria-label="Character makeover area">
      <div class="portrait-glow" aria-hidden="true"></div>
      <div id="instructionChip" class="instruction-chip">Pick a shade</div>

      <div id="characterStage" class="character-stage" aria-label="Princess makeover character">
        <img id="characterBase" class="character-base" alt="" draggable="false" />
        <div id="makeupLayers" class="makeup-layers" aria-hidden="true"></div>

        <svg id="eyeRig" class="eye-rig" viewBox="0 0 760 950" aria-hidden="true">
          <defs>
            <clipPath id="eyeClipLeft"><ellipse cx="305" cy="327" rx="42" ry="24" /></clipPath>
            <clipPath id="eyeClipRight"><ellipse cx="455" cy="326" rx="42" ry="24" /></clipPath>
          </defs>
          <g id="leftEyeRig" clip-path="url(#eyeClipLeft)">
            <ellipse id="leftIrisTint" cx="305" cy="327" rx="18" ry="19" fill="#4bbfe6" opacity=".34" />
            <circle cx="305" cy="327" r="7.6" fill="#183348" opacity=".9" />
            <circle cx="300" cy="321" r="3.4" fill="#fff" opacity=".92" />
          </g>
          <g id="rightEyeRig" clip-path="url(#eyeClipRight)">
            <ellipse id="rightIrisTint" cx="455" cy="326" rx="18" ry="19" fill="#4bbfe6" opacity=".34" />
            <circle cx="455" cy="326" r="7.6" fill="#183348" opacity=".9" />
            <circle cx="450" cy="320" r="3.4" fill="#fff" opacity=".92" />
          </g>
        </svg>

        <div id="gemsOverlay" class="asset-overlay gems-overlay"></div>
        <div id="earringsOverlay" class="asset-overlay earrings-overlay"></div>
        <div id="necklaceOverlay" class="asset-overlay necklace-overlay"></div>
        <div id="hairclipOverlay" class="asset-overlay hairclip-overlay"></div>
        <div id="tiaraOverlay" class="asset-overlay tiara-overlay"></div>
        <div id="sparkleOverlay" class="asset-overlay sparkle-overlay"></div>
        <img id="blinkOverlay" class="blink-overlay" src="./assets/blink.webp" alt="" draggable="false" />
      </div>

      <div id="toolCursor" class="tool-cursor" aria-hidden="true">
        <div class="tool-graphic"></div>
        <div class="tool-glow"></div>
      </div>
      <div id="particleLayer" class="particle-layer" aria-hidden="true"></div>
    </section>

    <section class="tray" aria-label="Makeup choices">
      <div class="tray-head">
        <div id="toolLabel" class="tool-label">Foundation brush</div>
        <div id="coverageWrap" class="coverage-wrap">
          <div class="coverage-track"><div id="coverageFill" class="coverage-fill"></div></div>
          <span id="coverageText">0%</span>
        </div>
      </div>
      <div id="options" class="options" role="list"></div>
      <div class="tray-actions">
        <button id="nextButton" class="primary-button" type="button" disabled>Continue <span>→</span></button>
      </div>
    </section>

    <div id="finishPanel" class="finish-panel" hidden>
      <div class="finish-bloom" aria-hidden="true"></div>
      <div class="finish-card">
        <div class="finish-kicker">Makeover complete</div>
        <h2>✨ Gorgeous! ✨</h2>
        <p>Your final look is ready.</p>
        <div class="finish-actions">
          <button id="replayButton" class="primary-button" type="button">Create another look</button>
          <button id="closeFinishButton" class="secondary-button" type="button">Admire the look</button>
        </div>
      </div>
    </div>
  </main>

  <script src="./character-loader.js"></script>
  <script src="./game.js"></script>
</body>
</html>
