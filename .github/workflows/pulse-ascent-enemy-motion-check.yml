name: Pulse Ascent enemy motion WebGL check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-enemy-motion-check.yml'
  workflow_dispatch:
jobs:
  enemy-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static server
        run: |
          python3 -m http.server 4173 >/tmp/pulse-server.log 2>&1 &
          sleep 2
      - name: Exercise articulated enemy families
        run: |
          cat >/tmp/enemy-motion.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-enemy-motion';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await ctx.newPage();const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.tap('#startBtn');
          await page.waitForFunction(()=>window.__pulseAscent?.running&&window.__pulseModelFusion?.ready&&window.__pulseEnemyDamageReactivity&&window.__pulseEnemyMotionRigs,{timeout:20000});
          const result=await page.evaluate(async()=>{
            const THREE=await import('three'),g=window.__pulseAscent;
            g.enemies.forEach(e=>e.dispose?.());g.enemies=[];
            // Mobile intentionally omits full GLB volume on some ordinary drones. Exercise the four
            // always-volumetric gameplay families so this remains a stable performance-aware regression.
            const types=['tank','node','prism','sentinel'],made=[];
            types.forEach((type,i)=>{const e=g.spawnEnemy(type,new THREE.Vector3((i-1.5)*2.4,(i%2?1:-1)*.7,-18-i*2.3),i*.4);if(e)made.push(e);});
            await new Promise(r=>setTimeout(r,1000));
            const before=made.map(e=>({type:e.type,p:e.__fusionModel?.children.filter(c=>c.name==='rez-volume-model').map(c=>[c.position.x,c.position.y,c.position.z,c.rotation.x,c.rotation.y,c.rotation.z])||[]}));
            made.forEach((e,i)=>{e.locked=i%2===0;});
            await new Promise(r=>setTimeout(r,650));
            const after=made.map(e=>({type:e.type,p:e.__fusionModel?.children.filter(c=>c.name==='rez-volume-model').map(c=>[c.position.x,c.position.y,c.position.z,c.rotation.x,c.rotation.y,c.rotation.z])||[]}));
            const changed=after.map((entry,i)=>entry.p.some((v,j)=>v.some((n,k)=>Math.abs(n-(before[i].p[j]?.[k]??n))>.0005)));
            const tank=made.find(e=>e.type==='tank');if(tank?.hp>1)tank.hit(1);await new Promise(r=>setTimeout(r,300));
            return{stats:window.__pulseEnemyMotionRigs.stats(),types:made.map(e=>e.type),fusion:made.map(e=>!!e.__fusionModel),rigged:made.map(e=>!!e.__motionRig),changed,damageReactive:!!tank?.__damageReactiveState,damageReleased:!!tank?.__damageReactiveState?.released};
          });
          if(result.types.length!==4||result.fusion.some(v=>!v)||result.rigged.some(v=>!v)||result.changed.some(v=>!v))throw new Error(`Enemy articulation invalid: ${JSON.stringify(result)}`);
          if(!result.damageReactive||result.damageReleased)throw new Error(`Damage integration invalid: ${JSON.stringify(result)}`);
          await page.waitForTimeout(250);await page.screenshot({path:`${out}/enemy-families-mobile.png`,fullPage:true});
          fs.writeFileSync(`${out}/state.json`,JSON.stringify({result,errors},null,2));
          await browser.close();if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify(result,null,2));
          NODE
          node /tmp/enemy-motion.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-enemy-motion
          path: pulse-ascent-enemy-motion/
          if-no-files-found: warn
          retention-days: 7
