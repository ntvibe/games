name: Pulse Ascent weapon signature check
on:
  push:
    paths:
      - 'pulse-ascent/weapon-signatures.js'
      - 'pulse-ascent/weapon-rhythm-mastery.js'
      - 'pulse-ascent/swarm-impact.js'
      - 'pulse-ascent/player-system.js'
      - 'pulse-ascent/pilot-performance.js'
      - 'pulse-ascent/index.html'
      - '.github/workflows/pulse-ascent-weapon-check.yml'
  workflow_dispatch:
jobs:
  weapon-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check --input-type=module < pulse-ascent/weapon-signatures.js
          node --check --input-type=module < pulse-ascent/weapon-rhythm-mastery.js
          node --check --input-type=module < pulse-ascent/swarm-impact.js
          grep -q "swarm-impact.js" pulse-ascent/weapon-rhythm-mastery.js
          grep -q "weapon-rhythm-mastery.js" pulse-ascent/index.html
          grep -q "weapon-rhythm-mastery.js" pulse-ascent/service-worker.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/pulse-weapon-server.log 2>&1 &
          sleep 2
      - name: Exercise charged LANCE and physical SWARM
        run: |
          cat >/tmp/pulse-weapon-check.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-weapon-check';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const ctx=await browser.newContext({viewport:{width:1280,height:800}});const page=await ctx.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.click('#startBtn');
          await page.waitForFunction(()=>window.__pulseAscent?.running&&window.__pulsePilotPerformance&&window.__pulseWeaponSignatures&&window.__pulseWeaponRhythmMastery&&window.__pulseSwarmImpact,{timeout:15000});
          await page.waitForTimeout(700);

          await page.evaluate(()=>{window.__pulsePilot.cycleWeapon();window.__pulseWeaponRhythmMastery.beginCharge();});
          await page.waitForTimeout(900);
          const charging=await page.evaluate(()=>window.__pulseWeaponRhythmMastery.stats());
          if(charging.charge<.7)throw new Error(`LANCE did not build meaningful charge: ${JSON.stringify(charging)}`);
          await page.evaluate(()=>{
            const g=window.__pulseAscent;g.enemies.forEach(e=>e.dispose?.());g.enemies=[];
            const ys=g.world.avatar.getWorldPosition(g.world.avatar.position.clone()).y+.55;
            const spawn=z=>{const p=g.world.avatar.position.clone();p.set(0,ys,z);const e=g.spawnEnemy('drone',p,1);e.group.position.set(0,ys,z);e.update=()=>{};return e;};
            const a=spawn(-12);spawn(-18);spawn(-24);g.targetsLocked=[a];a.locked=true;g.releaseFire();
          });
          await page.waitForFunction(()=>window.__pulseWeaponSignatures.stats().lanceShots>0,{timeout:5000});
          const lance=await page.evaluate(()=>({signature:window.__pulseWeaponSignatures.stats(),mastery:window.__pulseWeaponRhythmMastery.stats()}));
          if(lance.signature.pierces<1||lance.mastery.releases<1)throw new Error(`LANCE mastery invalid: ${JSON.stringify(lance)}`);
          await page.screenshot({path:`${out}/01-lance-charged-pierce.png`});
          await page.waitForTimeout(350);

          const before=await page.evaluate(()=>window.__pulseSwarmImpact.stats());
          await page.evaluate(()=>{
            const g=window.__pulseAscent;g.enemies.forEach(e=>e.dispose?.());g.enemies=[];window.__pulsePilot.cycleWeapon();
            const ys=g.world.avatar.getWorldPosition(g.world.avatar.position.clone()).y+.55;
            const pts=[[-2,ys,-14],[-.7,ys+.5,-17],[.7,ys-.35,-20],[2,ys+.25,-23]];const locks=[];
            for(const [x,y,z] of pts){const p=g.world.avatar.position.clone();p.set(x,y,z);const e=g.spawnEnemy('drone',p,1);e.group.position.set(x,y,z);e.update=()=>{};e.locked=true;locks.push(e);}g.targetsLocked=locks;g.releaseFire();
          });
          await page.waitForFunction(()=>window.__pulseSwarmImpact.stats().launched>0&&window.__pulseSwarmImpact.stats().active>0,{timeout:5000});
          const flight=await page.evaluate(()=>window.__pulseSwarmImpact.stats());
          await page.screenshot({path:`${out}/02-swarm-in-flight.png`});
          await page.waitForFunction(()=>window.__pulseSwarmImpact.stats().impacts>0,{timeout:5000});
          const impact=await page.evaluate(()=>window.__pulseSwarmImpact.stats());
          if(impact.impacts<=before.impacts)throw new Error(`SWARM damage did not wait for impact: ${JSON.stringify({before,flight,impact})}`);

          await page.evaluate(()=>{
            const g=window.__pulseAscent;g.enemies.forEach(e=>e.dispose?.());g.enemies=[];
            const ys=g.world.avatar.getWorldPosition(g.world.avatar.position.clone()).y+.55;
            const mk=(x,z)=>{const p=g.world.avatar.position.clone();p.set(x,ys,z);const e=g.spawnEnemy('tank',p,1);e.group.position.set(x,ys,z);e.update=()=>{};return e;};
            const a=mk(-1,-18),b=mk(1,-19);window.__pulseSwarmImpact.launch(a,0,1,.9,1);setTimeout(()=>{a.dead=true;a.group.visible=false;},35);window.__swarmReacquireTarget=b;
          });
          await page.waitForFunction(()=>window.__pulseSwarmImpact.stats().reacquired>0,{timeout:5000});
          await page.waitForTimeout(800);
          const reacquire=await page.evaluate(()=>window.__pulseSwarmImpact.stats());
          if(reacquire.reacquired<1)throw new Error(`SWARM did not reacquire a lost target: ${JSON.stringify(reacquire)}`);
          await page.screenshot({path:`${out}/03-swarm-reacquire.png`});
          fs.writeFileSync(`${out}/state.json`,JSON.stringify({charging,lance,before,flight,impact,reacquire,errors},null,2));
          await browser.close();if(errors.length)throw new Error(errors.join('\n'));
          NODE
          node /tmp/pulse-weapon-check.mjs
      - name: Upload weapon visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-weapon-check
          path: pulse-ascent-weapon-check/
          if-no-files-found: warn
          retention-days: 7