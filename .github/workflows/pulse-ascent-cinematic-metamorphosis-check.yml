name: Pulse Ascent Cinematic Metamorphosis Check

on:
  push:
    branches:
      - 'overnight/**'
    paths:
      - 'pulse-ascent/cinematic-metamorphosis-director.js'
      - 'pulse-ascent/temple-bloom-environment.js'
      - 'pulse-ascent/index.html'
      - '.github/workflows/pulse-ascent-cinematic-metamorphosis-check.yml'
  workflow_dispatch:

jobs:
  director-state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime registration
        run: |
          grep -q 'cinematic-metamorphosis-director.js' pulse-ascent/index.html
          grep -q "import('./temple-bloom-environment.js')" pulse-ascent/cinematic-metamorphosis-director.js
          grep -q 'new THREE.InstancedMesh' pulse-ascent/temple-bloom-environment.js
          grep -q '__pulseTempleBloom' pulse-ascent/temple-bloom-environment.js
          grep -q 'onFrame' pulse-ascent/cinematic-metamorphosis-director.js
      - name: Exercise deterministic cue envelopes
        shell: bash
        run: |
          cp pulse-ascent/cinematic-metamorphosis-director.js /tmp/cinematic-metamorphosis-director.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const {CinematicMetamorphosisDirector,METAMORPHOSIS_CUES}=await import('file:///tmp/cinematic-metamorphosis-director.mjs');

          assert.deepEqual(Object.keys(METAMORPHOSIS_CUES),['TEMPLE_BLOOM','TIME_FRACTURE','WORLD_ASCENT']);
          const director=new CinematicMetamorphosisDirector();
          let frameSample=null;
          director.onFrame((sample,dt)=>{frameSample={sample,dt};});

          director.trigger('TEMPLE_BLOOM',{reason:'regression'});
          assert.equal(director.sample().phase,'attack');
          assert.equal(director.sample().envelope,0);
          director.onStep(4);
          assert.equal(director.sample().phase,'hold');
          assert.equal(director.sample().openness,1);
          assert.equal(director.sample().fovOffset,5);
          director.emitFrame(director.sample(),1/60);
          assert.equal(frameSample.sample.id,'TEMPLE_BLOOM');
          assert.equal(frameSample.sample.openness,1);
          assert.equal(frameSample.dt,1/60);
          assert.equal(director.snapshot().frameConsumers,1);
          director.onStep(52);
          assert.equal(director.sample().phase,'release');
          director.onStep(64);
          assert.equal(director.sample().id,null);

          director.trigger('TIME_FRACTURE',{reason:'regression'});
          director.onStep(68);
          const fracture=director.sample();
          assert.equal(fracture.phase,'hold');
          assert.equal(fracture.timeFeel,.36);
          assert.equal(fracture.fovOffset,-6);

          const stats=director.snapshot();
          assert.equal(stats.history.length,2);
          assert.equal(stats.history[0].id,'TEMPLE_BLOOM');
          assert.equal(stats.history[1].id,'TIME_FRACTURE');
          console.log(JSON.stringify(stats,null,2));
          NODE
      - name: Verify Temple Bloom readability and mobile caps
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const src=fs.readFileSync('pulse-ascent/temple-bloom-environment.js','utf8');
          assert.match(src,/maxPillars=64/);
          assert.match(src,/mobile\?24:32/);
          assert.match(src,/mobile\?36:52/);
          assert.match(src,/mobile\?48:64/);
          assert.match(src,/9\.5\+lane\*3\.7/);
          assert.match(src,/depthWrite:false/);
          assert.match(src,/preview:\(envelope=1,beatPulse=1\)/);
          console.log('Temple Bloom instancing, side-corridor layout, density tiers and preview diagnostics present.');
          NODE
