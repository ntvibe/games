name: Pulse Ascent command exposure check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-command-exposure-check.yml'
  workflow_dispatch:
jobs:
  command-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and integration
        run: |
          node --check --input-type=module < pulse-ascent/command-exposure-visual.js
          node --check --input-type=module < pulse-ascent/phrase-tactical-opening.js
          grep -q "command-exposure-visual.js" pulse-ascent/phrase-tactical-opening.js
          grep -q "__pulseCommandExposureVisual" pulse-ascent/command-exposure-visual.js
          grep -q "NormalBlending" pulse-ascent/command-exposure-visual.js
          grep -q "pulse-ascent-v63" pulse-ascent/service-worker.js
          grep -q "command-exposure-visual.js" pulse-ascent/service-worker.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static server
        run: |
          python3 -m http.server 4173 >/tmp/pulse-server.log 2>&1 &
          sleep 2
      - name: Exercise physical command exposure
        run: |
          cat >/tmp/command-exposure.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-command-exposure';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await ctx.newPage(),errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
          page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.tap('#startBtn');
          await page.waitForFunction(()=>window.__pulseAscent?.running&&window.__pulseModelFusion?.ready&&window.__pulsePhraseTacticalOpening&&window.__pulseCommandExposureVisual,{timeout:25000});
          await page.evaluate(async()=>{
            const THREE=await import('three'),g=window.__pulseAscent,c=window.__pulseCampaign;
            g.enemies.forEach(e=>e.dispose?.());g.enemies=[];c.state.selected=2;g.section=2;g.bar=24;g.boss=null;
            const leader=g.spawnEnemy('sentinel',new THREE.Vector3(0,.2,-18),0),wing=g.spawnEnemy('prism',new THREE.Vector3(3,-.4,-21),.4);
            await new Promise(r=>setTimeout(r,950));
            leader.__formationId=880;leader.__formationVoice=0;wing.__formationId=880;wing.__formationVoice=1;
            dispatchEvent(new CustomEvent('pulse:enemy-phrase-memory-begin',{detail:{area:2,name:'MIRROR ANSWER',strong:true}}));
          });
          await page.waitForTimeout(320);
          const exposed=await page.evaluate(()=>{const g=window.__pulseAscent,l=g.enemies.find(e=>e.__formationId===880&&e.__formationVoice===0);return{visual:l?.__commandExposureVisual||null,tactical:window.__pulsePhraseTacticalOpening.stats(),system:window.__pulseCommandExposureVisual.stats()};});
          if(!exposed.visual||exposed.visual.open<.2||exposed.visual.plates!==4||exposed.visual.coreOpacity<=.08||!exposed.visual.normalBlending)throw new Error(`Physical exposure did not open: ${JSON.stringify(exposed)}`);
          if(exposed.tactical.strong<1||exposed.system.active<1||!exposed.system.normalBlending)throw new Error(`Exposure system state invalid: ${JSON.stringify(exposed)}`);
          await page.screenshot({path:`${out}/command-exposed-mobile.png`,fullPage:true});
          await page.waitForTimeout(1800);
          const settled=await page.evaluate(()=>{const g=window.__pulseAscent,l=g.enemies.find(e=>e.__formationId===880&&e.__formationVoice===0);return{visual:l?.__commandExposureVisual||null,system:window.__pulseCommandExposureVisual.stats()};});
          if(settled.system.active!==0||((settled.visual?.open||0)>.08))throw new Error(`Exposure did not close cleanly: ${JSON.stringify(settled)}`);
          await page.screenshot({path:`${out}/command-resealed-mobile.png`,fullPage:true});
          fs.writeFileSync(`${out}/state.json`,JSON.stringify({exposed,settled,errors},null,2));
          await browser.close();if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify({exposed,settled},null,2));
          NODE
          node /tmp/command-exposure.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-command-exposure
          path: pulse-ascent-command-exposure/
          if-no-files-found: warn
          retention-days: 7
