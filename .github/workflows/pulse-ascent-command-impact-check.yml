name: Pulse Ascent command impact check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-command-impact-check.yml'
  workflow_dispatch:
jobs:
  command-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and integration
        run: |
          node --check --input-type=module < pulse-ascent/command-exposure-impact.js
          node --check --input-type=module < pulse-ascent/formation-combat-state.js
          node --check --input-type=module < pulse-ascent/formation-consequence-director.js
          node --check --input-type=module < pulse-ascent/formation-weapon-scar-visual.js
          grep -q "command-exposure-impact.js" pulse-ascent/phrase-tactical-opening.js
          grep -q "__pulseCommandExposureImpact" pulse-ascent/command-exposure-impact.js
          grep -q "pulse:command-exposure-impact" pulse-ascent/command-exposure-impact.js
          grep -q "NormalBlending" pulse-ascent/command-exposure-impact.js
          grep -q "COMMAND BREACH" pulse-ascent/formation-combat-state.js
          grep -q "VOICE FRACTURE" pulse-ascent/formation-combat-state.js
          grep -q "SYNC COLLAPSE" pulse-ascent/formation-combat-state.js
          grep -q "pulse:formation-weapon-scar" pulse-ascent/formation-consequence-director.js
          grep -q "formation-weapon-scar-visual.js" pulse-ascent/formation-consequence-director.js
          grep -q "__pulseFormationWeaponScarVisual" pulse-ascent/formation-weapon-scar-visual.js
          grep -q "COMMAND BREACH" pulse-ascent/formation-weapon-scar-visual.js
          grep -q "VOICE FRACTURE" pulse-ascent/formation-weapon-scar-visual.js
          grep -q "SYNC COLLAPSE" pulse-ascent/formation-weapon-scar-visual.js
          grep -q "NormalBlending" pulse-ascent/formation-weapon-scar-visual.js
          grep -q "pulse-ascent-v66" pulse-ascent/service-worker.js
          grep -q "command-exposure-impact.js" pulse-ascent/service-worker.js
          grep -q "formation-weapon-scar-visual.js" pulse-ascent/service-worker.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static server
        run: |
          python3 -m http.server 4173 >/tmp/pulse-server.log 2>&1 &
          sleep 2
      - name: Exercise weapon-specific exposed-core reactions and scars
        run: |
          cat >/tmp/command-impact.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-command-impact';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.tap('#startBtn');
          await page.waitForFunction(()=>window.__pulseAscent?.running&&window.__pulseModelFusion?.ready&&window.__pulseCommandExposureVisual&&window.__pulseCommandExposureImpact&&window.__pulseFormationCombatState&&window.__pulseFormationConsequence&&window.__pulseFormationWeaponScarVisual,{timeout:25000});
          const scarUnit=await page.evaluate(()=>{
            const f=window.__pulseFormationCombatState;
            const src={__formationId:7001,__formationVoice:0};f.markRegroup(7001,1,{weapon:'lance',voice:0});const lance=f.adjustThreat(src,{speed:24,targetX:0});
            src.__formationId=7002;src.__formationVoice=2;f.markRegroup(7002,1,{weapon:'swarm',voice:2});const swarm=f.adjustThreat(src,{speed:24,targetX:0});
            src.__formationId=7003;src.__formationVoice=1;f.markRegroup(7003,1,{weapon:'lock',voice:0});const lock=f.adjustThreat(src,{speed:24,targetX:0});
            return{lance,swarm,lock,stats:f.stats()};
          });
          if(!scarUnit.lance.suppressed||scarUnit.lance.weaponScar!=='COMMAND BREACH')throw new Error(`LANCE command scar missing: ${JSON.stringify(scarUnit)}`);
          if(!scarUnit.swarm.suppressed||scarUnit.swarm.weaponScar!=='VOICE FRACTURE')throw new Error(`SWARM voice scar missing: ${JSON.stringify(scarUnit)}`);
          if(scarUnit.lock.weaponScar!=='SYNC COLLAPSE'||scarUnit.lock.speed>=24||scarUnit.lock.delay<.05)throw new Error(`LOCK sync scar missing: ${JSON.stringify(scarUnit)}`);
          await page.evaluate(async()=>{
            const THREE=await import('three'),g=window.__pulseAscent,c=window.__pulseCampaign;g.enemies.forEach(e=>e.dispose?.());g.enemies=[];c.state.selected=2;g.section=2;g.bar=24;g.boss=null;
            const leader=g.spawnEnemy('sentinel',new THREE.Vector3(0,.2,-18),0),wing=g.spawnEnemy('prism',new THREE.Vector3(3,-.4,-21),.4),wing2=g.spawnEnemy('node',new THREE.Vector3(-3,.5,-22),.8);await new Promise(r=>setTimeout(r,900));
            leader.hp=20;leader.__formationId=991;leader.__formationVoice=0;leader.__formationSize=3;wing.__formationId=991;wing.__formationVoice=1;wing.__formationSize=3;wing2.__formationId=991;wing2.__formationVoice=2;wing2.__formationSize=3;dispatchEvent(new CustomEvent('pulse:enemy-phrase-memory-begin',{detail:{area:2,name:'MIRROR ANSWER',strong:true}}));
          });
          await page.waitForTimeout(320);
          const lance=await page.evaluate(()=>{const l=window.__pulseAscent.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0);l.__hitFeedbackCtx={weapon:'lance',q:.96,at:performance.now(),index:0,total:1};l.hit(.2);return window.__pulseCommandExposureImpact.stats();});
          await page.waitForTimeout(55);
          const lanceVisual=await page.evaluate(()=>window.__pulseAscent.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0)?.__commandExposureImpact||null);
          if(lance.lance<1||!lanceVisual||lanceVisual.lance<=.15)throw new Error(`LANCE breach reaction missing: ${JSON.stringify({lance,lanceVisual})}`);
          await page.screenshot({path:`${out}/lance-breach-mobile.png`,fullPage:true});
          const swarm=await page.evaluate(()=>{const l=window.__pulseAscent.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0);l.__hitFeedbackCtx={weapon:'swarm',q:.82,at:performance.now(),index:2,total:4};l.hit(.2);return window.__pulseCommandExposureImpact.stats();});
          await page.waitForTimeout(55);
          const swarmVisual=await page.evaluate(()=>window.__pulseAscent.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0)?.__commandExposureImpact||null);
          if(swarm.swarm<1||!swarmVisual||Math.max(...swarmVisual.plates)<=.12)throw new Error(`SWARM plate destabilization missing: ${JSON.stringify({swarm,swarmVisual})}`);
          await page.screenshot({path:`${out}/swarm-fracture-mobile.png`,fullPage:true});
          const lock=await page.evaluate(()=>{const g=window.__pulseAscent,l=g.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0);l.hp=.1;l.__hitFeedbackCtx={weapon:'lock',q:.98,at:performance.now(),index:0,total:6};l.hit(1);window.__pulseFormationConsequence.processStep(((g.audio.step||0)+3)&~3);const successor=g.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0&&!e.dead);const scar=successor?window.__pulseFormationCombatState.adjustThreat(successor,{speed:24,targetX:0}):null;return{stats:window.__pulseCommandExposureImpact.stats(),finish:g.scene.children.some(o=>o.name==='command-exposure-lock-finish'),consequence:window.__pulseFormationConsequence.stats(),scar,successorScar:successor?.__commandWeaponScar||null,successorType:successor?.type||''};});
          if(lock.stats.perfectLock<1||lock.stats.kills<1||!lock.finish||!lock.stats.normalBlending)throw new Error(`Perfect LOCK collapse missing: ${JSON.stringify(lock)}`);
          if(lock.consequence.lastScar!=='SYNC COLLAPSE'||lock.consequence.weaponScars<1||lock.scar?.weaponScar!=='SYNC COLLAPSE'||!lock.successorScar)throw new Error(`Exposed LOCK aftermath missing: ${JSON.stringify(lock)}`);
          await page.waitForTimeout(240);
          const successorVisual=await page.evaluate(()=>{const s=window.__pulseAscent.enemies.find(e=>e.__formationId===991&&e.__formationVoice===0&&!e.dead);return{visual:s?.__formationWeaponScarVisual||null,stats:window.__pulseFormationWeaponScarVisual.stats()};});
          if(!successorVisual.visual||successorVisual.visual.weapon!=='lock'||successorVisual.visual.name!=='SYNC COLLAPSE'||successorVisual.visual.strength<=.2||successorVisual.visual.modules<1)throw new Error(`Persistent successor scar visual missing: ${JSON.stringify(successorVisual)}`);
          if(!successorVisual.visual.normalBlending||!successorVisual.stats.normalBlending||successorVisual.stats.active<1)throw new Error(`Successor scar blending/runtime invalid: ${JSON.stringify(successorVisual)}`);
          await page.screenshot({path:`${out}/successor-sync-collapse-mobile.png`,fullPage:true});
          fs.writeFileSync(`${out}/state.json`,JSON.stringify({scarUnit,lance,lanceVisual,swarm,swarmVisual,lock,successorVisual,errors},null,2));
          await browser.close();if(errors.length)throw new Error(errors.join('\n'));console.log(JSON.stringify({scarUnit,lance,lanceVisual,swarm,swarmVisual,lock,successorVisual},null,2));
          NODE
          node /tmp/command-impact.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-command-impact
          path: pulse-ascent-command-impact/
          if-no-files-found: warn
          retention-days: 7
