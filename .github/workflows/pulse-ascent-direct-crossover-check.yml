name: Pulse Ascent Direct Crossover check
on:
  push:
    paths:
      - 'pulse-ascent/direct-ascent-crossover.js'
      - 'pulse-ascent/direct-ascent-crossover-gameplay.js'
      - 'pulse-ascent/direct-ascent-remix.js'
      - 'pulse-ascent/service-worker.js'
      - '.github/workflows/pulse-ascent-direct-crossover-check.yml'
  workflow_dispatch:
jobs:
  crossover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check crossover modules
        run: |
          node --check --input-type=module < pulse-ascent/direct-ascent-crossover.js
          node --check --input-type=module < pulse-ascent/direct-ascent-crossover-gameplay.js
          node --check --input-type=module < pulse-ascent/direct-ascent-remix.js
      - name: Verify crossover integration
        run: |
          grep -q "import './direct-ascent-crossover.js'" pulse-ascent/direct-ascent-remix.js
          grep -q "import './direct-ascent-crossover-gameplay.js'" pulse-ascent/direct-ascent-crossover.js
          grep -q "__pulseDirectAscentCrossover" pulse-ascent/direct-ascent-crossover.js
          grep -q "NETWORK MEMORY" pulse-ascent/direct-ascent-crossover.js
          grep -q "direct-crossover-ghost" pulse-ascent/direct-ascent-crossover.js
          grep -q "NormalBlending" pulse-ascent/direct-ascent-crossover.js
          grep -q "__pulseDirectAscentCrossoverGameplay" pulse-ascent/direct-ascent-crossover-gameplay.js
          grep -q "LEGACY INVASION" pulse-ascent/direct-ascent-crossover-gameplay.js
          grep -q "MEMORY ATTACK" pulse-ascent/direct-ascent-crossover-gameplay.js
          grep -q "invasionFormation" pulse-ascent/direct-ascent-crossover-gameplay.js
          grep -q "legacyBossPattern" pulse-ascent/direct-ascent-crossover-gameplay.js
          grep -q "direct-ascent-crossover-gameplay.js" pulse-ascent/service-worker.js
          grep -q "pulse-ascent-v22" pulse-ascent/service-worker.js
