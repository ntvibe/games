name: Pulse Ascent smoke check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          for f in pulse-ascent/*.js; do node --check --input-type=module < "$f"; done
      - name: Check required files and integration
        run: |
          test -s pulse-ascent/index.html
          test -s pulse-ascent/style.css
          test -s pulse-ascent/game.js
          test -s pulse-ascent/boss-vulnerability.js
          test -s pulse-ascent/boss-consequences.js
          test -s pulse-ascent/elite-doctrine.js
          test -s pulse-ascent/doctrine-mastery.js
          test -s pulse-ascent/world-metamorphosis.js
          test -s pulse-ascent/pilot-transformation.js
          test -s pulse-ascent/generative-director.js
          test -s pulse-ascent/area-audio.js
          test -s pulse-ascent/synesthesia-layer-director.js
          test -s pulse-ascent/area-arranger.js
          test -s pulse-ascent/topology-worlds.js
          test -s pulse-ascent/topology-morph.js
          test -s pulse-ascent/topology-combat.js
          test -s pulse-ascent/enemy-art-direction.js
          test -s pulse-ascent/enemy-materialization.js
          test -s pulse-ascent/boss-topology-rewrite.js
          test -s pulse-ascent/visual-pruning.js
          grep -q "PULSE//ASCENT" pulse-ascent/index.html
          grep -q "boss-vulnerability.js" pulse-ascent/index.html
          grep -q "boss-consequences.js" pulse-ascent/index.html
          grep -q "elite-doctrine.js" pulse-ascent/index.html
          grep -q "doctrine-mastery.js" pulse-ascent/index.html
          grep -q "world-metamorphosis.js" pulse-ascent/index.html
          grep -q "pilot-transformation.js" pulse-ascent/index.html
          grep -q "generative-director.js" pulse-ascent/index.html
          grep -q "area-audio.js" pulse-ascent/index.html
          grep -q "synesthesia-layer-director.js" pulse-ascent/index.html
          grep -q "area-arranger.js" pulse-ascent/index.html
          grep -q "topology-worlds.js" pulse-ascent/index.html
          grep -q "topology-morph.js" pulse-ascent/index.html
          grep -q "topology-combat.js" pulse-ascent/index.html
          grep -q "enemy-art-direction.js" pulse-ascent/index.html
          grep -q "enemy-materialization.js" pulse-ascent/index.html
          grep -q "boss-topology-rewrite.js" pulse-ascent/index.html
          grep -q "visual-pruning.js" pulse-ascent/index.html
          grep -q "corePressurePaused" pulse-ascent/boss-consequences.js
          grep -q "EMITTER DOWN // BARRAGE WEAKENED" pulse-ascent/boss-consequences.js
          grep -q "EMITTER DOCTRINE ACQUIRED" pulse-ascent/elite-doctrine.js
          grep -q "GATE DOCTRINE ACQUIRED" pulse-ascent/elite-doctrine.js
          grep -q "RESONATOR DOCTRINE ACQUIRED" pulse-ascent/elite-doctrine.js
          grep -q "THREAT PROFILE -15%" pulse-ascent/doctrine-mastery.js
          grep -q "PHASE RECOVERY +18%" pulse-ascent/doctrine-mastery.js
          grep -q "RHYTHM WINDOW +12%" pulse-ascent/doctrine-mastery.js
          grep -q "__pulseDoctrineMastery" pulse-ascent/doctrine-mastery.js
          grep -q "WORLD RECOMPILE" pulse-ascent/world-metamorphosis.js
          grep -q "ShaderMaterial" pulse-ascent/world-metamorphosis.js
          grep -q "__worldMetamorphosis" pulse-ascent/world-metamorphosis.js
          grep -q "FORM SHIFT" pulse-ascent/pilot-transformation.js
          grep -q "__pilotTransformation" pulse-ascent/pilot-transformation.js
          grep -q "makeTransformField" pulse-ascent/pilot-transformation.js
          grep -q "__pulseGenerativeDirector" pulse-ascent/generative-director.js
          grep -q "__pulseAreaAudio" pulse-ascent/area-audio.js
          grep -q "LEGACY_ROOTS" pulse-ascent/synesthesia-layer-director.js
          grep -q "__pulseSynesthesiaLayerDirector" pulse-ascent/synesthesia-layer-director.js
          grep -q "__pulseAreaArranger" pulse-ascent/area-arranger.js
          grep -q "GLASS TEMPLE" pulse-ascent/area-arranger.js
          grep -q "NEURAL CATHEDRAL" pulse-ascent/area-arranger.js
          grep -q "__pulseTopologyWorlds" pulse-ascent/topology-worlds.js
          grep -q "PCB canyon" pulse-ascent/topology-worlds.js
          grep -q "Cathedral" pulse-ascent/topology-worlds.js
          grep -q "__pulseTopologyMorph" pulse-ascent/topology-morph.js
          grep -q "central signal spine" pulse-ascent/topology-morph.js
          grep -q "__pulseTopologyCombat" pulse-ascent/topology-combat.js
          grep -q "nearestSegment" pulse-ascent/topology-combat.js
          grep -q "Organic branching" pulse-ascent/topology-combat.js
          grep -q "__pulseEnemyArtDirection" pulse-ascent/enemy-art-direction.js
          grep -q "PCB elbows" pulse-ascent/enemy-art-direction.js
          grep -q "NormalBlending" pulse-ascent/enemy-art-direction.js
          grep -q "__pulseEnemyMaterialization" pulse-ascent/enemy-materialization.js
          grep -q "game.enemies.length>before" pulse-ascent/enemy-materialization.js
          grep -q "traceBurst(enemy,'recycle')" pulse-ascent/enemy-materialization.js
          grep -q "__pulseBossTopology" pulse-ascent/boss-topology-rewrite.js
          grep -q "AREA_NAMES" pulse-ascent/boss-topology-rewrite.js
          grep -q "releaseToWorld" pulse-ascent/boss-topology-rewrite.js
          grep -q "NormalBlending" pulse-ascent/boss-topology-rewrite.js
          grep -q "generative-architecture" pulse-ascent/visual-pruning.js
          grep -q "pulse-ascent-v8" pulse-ascent/service-worker.js