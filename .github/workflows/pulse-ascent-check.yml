name: Pulse Ascent smoke check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          for f in pulse-ascent/*.js; do node --check --input-type=module < "$f"; done
      - name: Check required files and boss integration
        run: |
          test -s pulse-ascent/index.html
          test -s pulse-ascent/style.css
          test -s pulse-ascent/game.js
          test -s pulse-ascent/boss-vulnerability.js
          test -s pulse-ascent/boss-consequences.js
          test -s pulse-ascent/elite-doctrine.js
          test -s pulse-ascent/doctrine-mastery.js
          grep -q "PULSE//ASCENT" pulse-ascent/index.html
          grep -q "boss-vulnerability.js" pulse-ascent/index.html
          grep -q "boss-consequences.js" pulse-ascent/index.html
          grep -q "elite-doctrine.js" pulse-ascent/index.html
          grep -q "doctrine-mastery.js" pulse-ascent/index.html
          grep -q "corePressurePaused" pulse-ascent/boss-consequences.js
          grep -q "EMITTER DOWN // BARRAGE WEAKENED" pulse-ascent/boss-consequences.js
          grep -q "EMITTER DOCTRINE ACQUIRED" pulse-ascent/elite-doctrine.js
          grep -q "GATE DOCTRINE ACQUIRED" pulse-ascent/elite-doctrine.js
          grep -q "RESONATOR DOCTRINE ACQUIRED" pulse-ascent/elite-doctrine.js
          grep -q "THREAT PROFILE -15%" pulse-ascent/doctrine-mastery.js
          grep -q "PHASE RECOVERY +18%" pulse-ascent/doctrine-mastery.js
          grep -q "RHYTHM WINDOW +12%" pulse-ascent/doctrine-mastery.js
          grep -q "__pulseDoctrineMastery" pulse-ascent/doctrine-mastery.js
