name: Pulse Ascent progression check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-progression-check.yml'
  workflow_dispatch:
jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 4173 > /tmp/pulse-progression-server.log 2>&1 &
          sleep 2
      - name: Validate progression loop
        run: |
          cat > /tmp/progression-check.mjs <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const errors=[];
          const context=await browser.newContext({viewport:{width:1280,height:800}});const page=await context.newPage();
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});
          await page.click('#startBtn');await page.waitForFunction(()=>window.__pulseProgression&&window.__pulseAscent?.running,{timeout:12000});
          let state=await page.evaluate(()=>({stats:window.__pulseProgression.stats(),hud:!!document.querySelector('#runProgression'),mission:document.querySelector('#missionText')?.textContent,rank:document.querySelector('#liveRank')?.textContent}));
          if(!state.hud||!state.mission?.includes('BUILD SYNC')||!['D','C','B','A','S','S+'].includes(state.rank))throw new Error(`Initial progression invalid: ${JSON.stringify(state)}`);
          await page.evaluate(()=>{window.__pulseAscent.sync=60;});await page.waitForTimeout(350);
          state=await page.evaluate(()=>({stats:window.__pulseProgression.stats(),score:window.__pulseAscent.score,complete:document.querySelector('.mission')?.classList.contains('complete')}));
          if(!state.complete||!state.stats.completed.some(v=>v.includes('BUILD SYNC'))||state.score<750)throw new Error(`Directive reward invalid: ${JSON.stringify(state)}`);
          await page.evaluate(()=>window.__pulseAscent.setSection(3,'RUPTURE // FREE VECTOR'));await page.waitForTimeout(80);
          const rupture=await page.evaluate(()=>window.__pulseProgression.stats());if(!rupture.mission.includes('RUPTURE CLEAR'))throw new Error(`Rupture directive invalid: ${JSON.stringify(rupture)}`);
          await page.evaluate(()=>window.__pulseAscent.setSection(3,'ASCENSION // REENTRY'));await page.waitForTimeout(80);
          const reentry=await page.evaluate(()=>window.__pulseProgression.stats());if(!reentry.mission.includes('ASCEND'))throw new Error(`Reentry directive invalid: ${JSON.stringify(reentry)}`);
          await page.evaluate(()=>{const g=window.__pulseAscent;g.score=12345;g.sync=90;g.finish();});await page.waitForTimeout(120);
          const result=await page.evaluate(()=>({rank:document.querySelector('#finalRank')?.textContent,best:document.querySelector('#finalBest')?.textContent,summary:!!document.querySelector('#runSummary'),stored:JSON.parse(localStorage.getItem('pulse-ascent-best-v1')||'{}').score||0}));
          if(!result.summary||result.stored!==12345||!result.best?.includes('12,345'))throw new Error(`Result persistence invalid: ${JSON.stringify(result)}`);
          await context.close();
          const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});const mp=await mobile.newPage();
          await mp.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await mp.tap('#startBtn');await mp.waitForFunction(()=>window.__pulseProgression&&window.__pulseAscent?.running,{timeout:12000});await mp.waitForTimeout(150);
          const mobileState=await mp.evaluate(()=>{const r=document.querySelector('#runProgression').getBoundingClientRect();return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,overflow:[document.documentElement.scrollWidth-innerWidth,document.documentElement.scrollHeight-innerHeight],mission:document.querySelector('#missionText')?.textContent};});
          if(mobileState.left<0||mobileState.right>390||mobileState.overflow[0]>1||mobileState.overflow[1]>1)throw new Error(`Mobile progression overflow: ${JSON.stringify(mobileState)}`);
          await mobile.close();await browser.close();if(errors.length)throw new Error(errors.join('\n'));console.log(JSON.stringify({state,rupture,reentry,result,mobileState},null,2));
          NODE
          node /tmp/progression-check.mjs
