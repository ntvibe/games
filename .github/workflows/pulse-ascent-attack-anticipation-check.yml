name: Pulse Ascent attack anticipation WebGL check
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-attack-anticipation-check.yml'
  workflow_dispatch:
jobs:
  attack-anticipation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check anticipation module syntax and offline integration
        run: |
          node --check --input-type=module < pulse-ascent/enemy-attack-anticipation.js
          grep -q "enemy-attack-anticipation.js" pulse-ascent/flow-combat-execution.js
          grep -q "enemy-attack-anticipation.js" pulse-ascent/service-worker.js
          grep -q "pulse-ascent-v53" pulse-ascent/service-worker.js
          grep -q "MIRROR OPEN" pulse-ascent/enemy-attack-anticipation.js
          grep -q "HELIX WIND" pulse-ascent/enemy-attack-anticipation.js
          grep -q "BRANCH RECOIL" pulse-ascent/enemy-attack-anticipation.js
          grep -q "CHOIR COUNT" pulse-ascent/enemy-attack-anticipation.js
          grep -q "RELEASE_GRID" pulse-ascent/enemy-attack-anticipation.js
          grep -q "scheduleCue" pulse-ascent/enemy-attack-anticipation.js
          grep -q "pulse:enemy-beat-launch" pulse-ascent/enemy-attack-anticipation.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static server
        run: |
          python3 -m http.server 4173 >/tmp/pulse-server.log 2>&1 &
          sleep 2
      - name: Exercise beat-synced pre-fire poses and projectile launch
        run: |
          cat >/tmp/attack-anticipation.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-attack-anticipation';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await ctx.newPage();const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.tap('#startBtn');
          await page.waitForFunction(()=>window.__pulseAscent?.running&&window.__pulseModelFusion?.ready&&window.__pulseEnemyMotionRigs&&window.__pulseAreaEnemyAttacks&&window.__pulseEnemyAttackAnticipation,{timeout:25000});

          const glass=await page.evaluate(async()=>{
            const THREE=await import('three'),g=window.__pulseAscent,c=window.__pulseCampaign;
            g.enemies.forEach(e=>e.dispose?.());g.enemies=[];c.state.selected=2;g.section=1;g.bar=20;g.boss=null;
            const left=g.spawnEnemy('sentinel',new THREE.Vector3(-3,.4,-21),0),right=g.spawnEnemy('sentinel',new THREE.Vector3(3,-.3,-22),.4);
            await new Promise(r=>setTimeout(r,900));
            const before=[left,right].map(e=>e.__fusionModel.children.filter(c=>c.name==='rez-volume-model').map(m=>[m.scale.x,m.scale.y,m.scale.z]));
            const triggered=window.__pulseAreaEnemyAttacks.trigger(6);
            await new Promise(r=>setTimeout(r,65));
            const threats=g.enemies.filter(e=>e.type==='danger'&&e.__areaAttackSignature);
            const during=[left,right].map(e=>e.__fusionModel.children.filter(c=>c.name==='rez-volume-model').map(m=>[m.scale.x,m.scale.y,m.scale.z]));
            const changed=during.map((entry,i)=>entry.some((v,j)=>v.some((n,k)=>Math.abs(n-(before[i][j]?.[k]??n))>.001)));
            return{triggered,threats:threats.length,hidden:threats.map(e=>e.group.visible===false),speed:threats.map(e=>e.speed),armed:threats.map(e=>!!e.__attackAnticipationArmed),gridSynced:threats.map(e=>!!e.__attackGridSynced),targetStep:threats.map(e=>e.__attackTargetStep),changed,stats:window.__pulseEnemyAttackAnticipation.stats()};
          });
          if(!glass.triggered||glass.threats<2)throw new Error(`Glass attack did not spawn paired threats: ${JSON.stringify(glass)}`);
          if(glass.hidden.some(v=>!v)||glass.speed.some(v=>v!==0)||glass.armed.some(v=>!v))throw new Error(`Threat did not wait behind anticipation pose: ${JSON.stringify(glass)}`);
          if(glass.gridSynced.some(v=>!v)||glass.targetStep.some(v=>v<0||v%4!==0))throw new Error(`Glass threats were not quantized to a beat boundary: ${JSON.stringify(glass)}`);
          if(glass.changed.some(v=>!v))throw new Error(`Glass attack pose did not articulate source models: ${JSON.stringify(glass)}`);
          if(glass.stats.lastName!=='MIRROR OPEN'||glass.stats.active<1||glass.stats.states.some(s=>!s.gridSynced||s.targetStep%4!==0))throw new Error(`Anticipation diagnostics invalid: ${JSON.stringify(glass)}`);
          await page.screenshot({path:`${out}/mirror-open-beat-windup-mobile.png`,fullPage:true});
          await page.waitForFunction(()=>window.__pulseEnemyAttackAnticipation.stats().active===0&&window.__pulseEnemyAttackAnticipation.stats().launched>=2,{timeout:1800});
          const glassLaunched=await page.evaluate(()=>{const g=window.__pulseAscent,t=g.enemies.filter(e=>e.type==='danger'&&e.__areaAttackSignature);return{visible:t.map(e=>e.group.visible),speed:t.map(e=>e.speed),launched:t.map(e=>!!e.__attackLaunched),error:t.map(e=>e.__attackLaunchErrorMs),stats:window.__pulseEnemyAttackAnticipation.stats()};});
          if(glassLaunched.visible.some(v=>!v)||glassLaunched.speed.some(v=>v<=0)||glassLaunched.launched.some(v=>!v))throw new Error(`Glass threats did not launch on the beat: ${JSON.stringify(glassLaunched)}`);
          if(glassLaunched.error.some(v=>!Number.isFinite(v)||Math.abs(v)>55)||Math.abs(glassLaunched.stats.lastLaunchErrorMs)>55)throw new Error(`Glass launch drift exceeded 55ms: ${JSON.stringify(glassLaunched)}`);
          await page.screenshot({path:`${out}/mirror-crossfire-beat-launch-mobile.png`,fullPage:true});

          const choir=await page.evaluate(async()=>{
            const THREE=await import('three'),g=window.__pulseAscent,c=window.__pulseCampaign;
            g.enemies.forEach(e=>e.dispose?.());g.enemies=[];c.state.selected=5;g.section=1;g.bar=20;g.boss=null;
            g.spawnEnemy('sentinel',new THREE.Vector3(-2.6,.5,-21),0);g.spawnEnemy('sentinel',new THREE.Vector3(2.4,-.2,-22),.5);
            await new Promise(r=>setTimeout(r,900));
            const triggered=window.__pulseAreaEnemyAttacks.trigger(4);await new Promise(r=>setTimeout(r,90));
            const threats=g.enemies.filter(e=>e.type==='danger'&&e.__areaAttackSignature),stats=window.__pulseEnemyAttackAnticipation.stats();
            return{triggered,threats:threats.length,hidden:threats.map(e=>e.group.visible===false),targetStep:threats.map(e=>e.__attackTargetStep),stats};
          });
          if(!choir.triggered||choir.threats<1||choir.hidden.some(v=>!v))throw new Error(`Cathedral choir windup missing: ${JSON.stringify(choir)}`);
          if(choir.targetStep.some(v=>v<0||v%4!==0)||choir.stats.lastName!=='CHOIR COUNT'||choir.stats.states.some(s=>!s.gridSynced))throw new Error(`Cathedral attack was not beat-quantized: ${JSON.stringify(choir)}`);
          await page.screenshot({path:`${out}/choir-count-beat-windup-mobile.png`,fullPage:true});
          await page.waitForFunction(()=>window.__pulseEnemyAttackAnticipation.stats().active===0,{timeout:2200});
          const choirLaunched=await page.evaluate(()=>window.__pulseEnemyAttackAnticipation.stats());
          if(choirLaunched.syncedLaunches<3||Math.abs(choirLaunched.lastLaunchErrorMs)>55)throw new Error(`Cathedral launch timing invalid: ${JSON.stringify(choirLaunched)}`);
          await page.screenshot({path:`${out}/choir-count-beat-launch-mobile.png`,fullPage:true});

          fs.writeFileSync(`${out}/state.json`,JSON.stringify({glass,glassLaunched,choir,choirLaunched,errors},null,2));
          await browser.close();if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify({glass,glassLaunched,choir,choirLaunched},null,2));
          NODE
          node /tmp/attack-anticipation.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-attack-anticipation
          path: pulse-ascent-attack-anticipation/
          if-no-files-found: warn
          retention-days: 7
