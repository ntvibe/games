name: Pulse Ascent visual gauntlet
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-visual-check.yml'
  workflow_dispatch:
jobs:
  browser-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static server
        run: |
          python3 -m http.server 4173 > /tmp/pulse-server.log 2>&1 &
          echo $! > /tmp/pulse-server.pid
          sleep 2
      - name: Run browser gauntlet
        run: |
          cat > /tmp/pulse-gauntlet.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-gauntlet';fs.mkdirSync(out,{recursive:true});
          const errors=[];
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          async function attach(page,label){
            page.on('pageerror',e=>errors.push(`${label} pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`${label} console: ${m.text()}`)});
          }
          const desktop=await browser.newContext({viewport:{width:1440,height:900}});const page=await desktop.newPage();await attach(page,'desktop');
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.screenshot({path:`${out}/01-start-desktop.png`});
          await page.click('#startBtn');await page.waitForFunction(()=>window.__pulseAscent?.running===true,{timeout:12000});await page.waitForTimeout(2600);
          const point=await page.evaluate(()=>{const g=window.__pulseAscent,t=g.enemies.find(e=>!e.dead&&e.type!=='danger');if(!t)return null;const p=t.group.position.clone().project(g.camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2};});
          if(!point)throw new Error('No target available for lock test');
          await page.mouse.move(point.x,point.y);await page.mouse.down();await page.waitForTimeout(180);await page.mouse.up();await page.waitForTimeout(900);
          const combat=await page.evaluate(()=>({shots:window.__pulseAscent.shots,releases:window.__pulseAscent.releaseCount,score:window.__pulseAscent.score,sync:window.__pulseAscent.sync,enemies:window.__pulseAscent.enemies.length,canvas:[document.querySelector('canvas')?.width,document.querySelector('canvas')?.height]}));
          if(combat.shots<1||combat.releases<1)throw new Error(`Lock/release did not fire: ${JSON.stringify(combat)}`);
          await page.screenshot({path:`${out}/02-combat-desktop.png`});

          await page.waitForFunction(()=>window.__pulseExpansion?.assets?.ready===true,{timeout:15000});
          await page.evaluate(()=>window.__pulseExpansion.startTestRupture());await page.waitForTimeout(1200);
          const rupture=await page.evaluate(()=>{const x=window.__pulseExpansion,g=window.__pulseAscent;return{...x.stats(),ruptureEnemies:g.enemies.filter(e=>e.type==='rupture'&&!e.dead).length,chip:document.querySelector('#modeChip')?.textContent,linesVisible:g.world.lines.visible};});
          if(!rupture.active||rupture.mode!=='rupture'||rupture.assetsLoaded<4||rupture.decor<8||rupture.weapons<1||rupture.ruptureEnemies<4||rupture.linesVisible)throw new Error(`Rupture state invalid: ${JSON.stringify(rupture)}`);
          await page.screenshot({path:`${out}/03-free-vector-desktop.png`});
          const rpoint=await page.evaluate(()=>{const g=window.__pulseAscent,t=g.enemies.find(e=>e.type==='rupture'&&!e.dead);if(!t)return null;const p=t.group.position.clone().project(g.camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2};});
          if(rpoint){await page.mouse.move(rpoint.x,rpoint.y);await page.mouse.down();await page.waitForTimeout(220);await page.mouse.up();await page.waitForTimeout(650);}
          await page.evaluate(()=>window.__pulseExpansion.stopTestRupture());await page.waitForTimeout(250);

          await page.evaluate(()=>{const g=window.__pulseAscent;g.audio.listeners.clear();g.enemies.forEach(e=>e.dispose());g.enemies=[];g.particles.life.fill(0);for(let i=2;i<g.particles.positions.length;i+=3)g.particles.positions[i]=9999;g.particles.dirty();g.onStep(40*16,g.audio.ctx.currentTime);});await page.waitForTimeout(450);
          await page.screenshot({path:`${out}/04-boss-intro-desktop.png`});await page.waitForTimeout(750);
          const boss=await page.evaluate(()=>({exists:!!window.__pulseAscent.boss,visible:!document.querySelector('#bossHud').classList.contains('hidden'),parts:window.__pulseAscent.boss?.parts.length||0,phase:window.__pulseAscent.boss?.phase||0,health:window.__pulseAscent.boss?.healthRatio?.()||0,section:document.querySelector('#sectionName').textContent,enemies:window.__pulseAscent.enemies.length}));
          if(!boss.exists||!boss.visible||boss.parts!==8||!boss.section.includes('CONVERGENCE')||boss.enemies!==0)throw new Error(`Boss state invalid: ${JSON.stringify(boss)}`);
          await page.screenshot({path:`${out}/05-boss-active-desktop.png`});await desktop.close();

          const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});const mp=await mobile.newPage();await attach(mp,'mobile');
          await mp.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await mp.screenshot({path:`${out}/06-start-mobile.png`});await mp.tap('#startBtn');await mp.waitForFunction(()=>window.__pulseAscent?.running===true,{timeout:12000});await mp.waitForFunction(()=>window.__pulseExpansion?.assets?.ready===true,{timeout:15000});await mp.waitForTimeout(900);
          await mp.evaluate(()=>window.__pulseExpansion.startTestRupture());await mp.waitForTimeout(900);await mp.screenshot({path:`${out}/07-free-vector-mobile.png`,fullPage:true});
          const mobileState=await mp.evaluate(()=>({overflow:[document.documentElement.scrollWidth-innerWidth,document.documentElement.scrollHeight-innerHeight],hud:document.querySelector('#hud').getBoundingClientRect().toJSON(),sync:document.querySelector('#sync').textContent,mode:window.__pulseExpansion?.state.mode,assets:window.__pulseExpansion?.assets.models.size,chip:document.querySelector('#modeChip')?.textContent}));
          if(mobileState.overflow[0]>1||mobileState.overflow[1]>1||mobileState.mode!=='rupture'||mobileState.assets<4)throw new Error(`Mobile rupture invalid: ${JSON.stringify(mobileState)}`);await mobile.close();await browser.close();
          fs.writeFileSync(`${out}/state.json`,JSON.stringify({combat,rupture,boss,mobileState,errors},null,2));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify({combat,rupture,boss,mobileState},null,2));
          NODE
          node /tmp/pulse-gauntlet.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-gauntlet
          path: pulse-ascent-gauntlet/
          if-no-files-found: warn
          retention-days: 7
