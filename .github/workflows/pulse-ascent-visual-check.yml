name: Pulse Ascent visual gauntlet
on:
  push:
    paths:
      - 'pulse-ascent/**'
      - '.github/workflows/pulse-ascent-visual-check.yml'
  workflow_dispatch:
jobs:
  browser-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run static server
        run: |
          python3 -m http.server 4173 > /tmp/pulse-server.log 2>&1 &
          echo $! > /tmp/pulse-server.pid
          sleep 2
      - name: Run browser gauntlet
        run: |
          cat > /tmp/pulse-gauntlet.mjs <<'NODE'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright');
          const out='pulse-ascent-gauntlet';fs.mkdirSync(out,{recursive:true});
          const errors=[];
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          async function attach(page,label){
            page.on('pageerror',e=>errors.push(`${label} pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`${label} console: ${m.text()}`)});
          }
          const desktop=await browser.newContext({viewport:{width:1440,height:900}});const page=await desktop.newPage();await attach(page,'desktop');
          await page.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await page.screenshot({path:`${out}/01-start-desktop.png`});
          await page.click('#startBtn');await page.waitForFunction(()=>window.__pulseAscent?.running===true,{timeout:12000});await page.waitForFunction(()=>window.__pulsePilot?.rig&&window.__pulseExpansion?.assets&&window.__pulseAreaSetpieces,{timeout:12000});await page.waitForFunction(()=>window.__pulseTopologyWorlds?.worlds?.length===5,{timeout:12000});await page.waitForTimeout(1800);

          const topology=await page.evaluate(()=>{const t=window.__pulseTopologyWorlds,g=window.__pulseAscent,a=t.area-1,w=t.worlds[a];return{area:t.area,layer:t.layer,segments:w?.totalSegments||0,visible:!!w?.root?.visible,primitiveVisible:!!g.scene.getObjectByName('generative-architecture')?.visible,packets:w?.packetCount||0};});
          if(!topology.visible||topology.primitiveVisible||topology.segments<70||topology.packets<20)throw new Error(`Topology world invalid: ${JSON.stringify(topology)}`);
          await page.screenshot({path:`${out}/02-topology-desktop.png`});

          const setpiece=await page.evaluate(()=>{const g=window.__pulseAscent,s=window.__pulseAreaSetpieces;const fired=s.trigger(1),before=g.enemies.length,bar=s.stats().suppressedBar;g.spawnPattern(bar);const after=g.enemies.length;return{...s.stats(),fired,enemies:after,genericSuppressed:after===before};});
          if(!setpiece.fired||!setpiece.active||setpiece.name!=='DATA CONVOY'||setpiece.enemies<7||!setpiece.genericSuppressed)throw new Error(`Area setpiece invalid: ${JSON.stringify(setpiece)}`);
          await page.waitForTimeout(350);await page.screenshot({path:`${out}/02b-setpiece-desktop.png`});

          const pilot=await page.evaluate(()=>({stats:window.__pulsePilot.stats(),meshes:window.__pulsePilot.rig.meshes.length,fragments:window.__pulsePilot.rig.fragments.geometry.attributes.position.count,controls:!!document.querySelector('#pilotControls'),weaponText:document.querySelector('#weaponCycle b')?.textContent,speedText:document.querySelector('#speedCycle b')?.textContent,avatarY:window.__pulseAscent.world.avatar.position.y}));
          if(!pilot.stats.humanoid||pilot.meshes<16||pilot.fragments<180||!pilot.controls||pilot.weaponText!=='LOCK//8'||pilot.stats.speed<1.2||pilot.avatarY<-2.5)throw new Error(`Pilot system invalid: ${JSON.stringify(pilot)}`);
          await page.screenshot({path:`${out}/03-pilot-desktop.png`});

          const point=await page.evaluate(()=>{const g=window.__pulseAscent,t=g.enemies.find(e=>!e.dead&&e.type!=='danger');if(!t)return null;const p=t.group.position.clone().project(g.camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2};});
          if(!point)throw new Error('No target available for lock test');
          await page.mouse.move(point.x,point.y);await page.mouse.down();await page.waitForTimeout(180);await page.mouse.up();await page.waitForTimeout(900);
          const combat=await page.evaluate(()=>({shots:window.__pulseAscent.shots,releases:window.__pulseAscent.releaseCount,score:window.__pulseAscent.score,sync:window.__pulseAscent.sync,enemies:window.__pulseAscent.enemies.length,canvas:[document.querySelector('canvas')?.width,document.querySelector('canvas')?.height]}));
          if(combat.shots<1||combat.releases<1)throw new Error(`Lock/release did not fire: ${JSON.stringify(combat)}`);
          await page.screenshot({path:`${out}/04-combat-desktop.png`});

          await page.locator('#weaponCycle').dispatchEvent('pointerdown');await page.waitForTimeout(100);
          const threat=await page.evaluate(()=>{const g=window.__pulseAscent,p=g.world.avatar.position.clone();p.set(0,0,-18);const e=g.spawnEnemy('danger',p,1);return{weapon:window.__pulsePilot.stats().weapon,styled:!!e?.__threatStyled,targetable:g.getTargetList().includes(e),hasTrail:!!e?.threatTrail,hasCage:!!e?.threatCage};});
          if(threat.weapon!=='LANCE'||!threat.styled||!threat.targetable||!threat.hasTrail||!threat.hasCage)throw new Error(`Threat/LANCE logic invalid: ${JSON.stringify(threat)}`);
          const threatPoint=await page.evaluate(()=>{const g=window.__pulseAscent,t=g.enemies.find(e=>e.type==='danger'&&!e.dead);const p=t.group.position.clone().project(g.camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2};});
          await page.mouse.move(threatPoint.x,threatPoint.y);await page.mouse.down();await page.waitForTimeout(140);await page.mouse.up();await page.waitForTimeout(700);
          const threatAfter=await page.evaluate(()=>({alive:window.__pulseAscent.enemies.some(e=>e.type==='danger'&&!e.dead),score:window.__pulseAscent.score,weapon:window.__pulsePilot.stats().weapon}));
          if(threatAfter.alive)throw new Error(`LANCE did not intercept threat: ${JSON.stringify(threatAfter)}`);
          await page.locator('#speedCycle').dispatchEvent('pointerdown');await page.waitForTimeout(80);
          const speedState=await page.evaluate(()=>window.__pulsePilot.stats());if(speedState.speed<1.49)throw new Error(`Speed cycle failed: ${JSON.stringify(speedState)}`);
          await page.screenshot({path:`${out}/05-lance-speed-desktop.png`});

          await page.waitForFunction(()=>window.__pulseExpansion?.assets?.ready===true,{timeout:15000});
          await page.evaluate(()=>window.__pulseExpansion.startTestRupture());await page.waitForTimeout(1200);
          const rupture=await page.evaluate(()=>{const x=window.__pulseExpansion,g=window.__pulseAscent;return{...x.stats(),ruptureEnemies:g.enemies.filter(e=>e.type==='rupture'&&!e.dead).length,chip:document.querySelector('#modeChip')?.textContent,linesVisible:g.world.lines.visible,pilot:window.__pulsePilot.stats(),avatarY:g.world.avatar.position.y};});
          if(!rupture.active||rupture.mode!=='rupture'||rupture.assetsLoaded<4||rupture.decor<8||rupture.weapons<1||rupture.ruptureEnemies<4||rupture.linesVisible||!rupture.pilot.humanoid)throw new Error(`Rupture state invalid: ${JSON.stringify(rupture)}`);
          await page.screenshot({path:`${out}/06-free-vector-desktop.png`});
          const rpoint=await page.evaluate(()=>{const g=window.__pulseAscent,t=g.enemies.find(e=>e.type==='rupture'&&!e.dead);if(!t)return null;const p=t.group.position.clone().project(g.camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2};});
          if(rpoint){await page.mouse.move(rpoint.x,rpoint.y);await page.mouse.down();await page.waitForTimeout(220);await page.mouse.up();await page.waitForTimeout(650);}
          await page.evaluate(()=>window.__pulseExpansion.stopTestRupture());await page.waitForTimeout(250);

          await page.evaluate(()=>{const g=window.__pulseAscent;g.audio.listeners.clear();g.enemies.forEach(e=>e.dispose());g.enemies=[];g.particles.life.fill(0);for(let i=2;i<g.particles.positions.length;i+=3)g.particles.positions[i]=9999;g.particles.dirty();g.onStep(40*16,g.audio.ctx.currentTime);});await page.waitForTimeout(450);
          await page.screenshot({path:`${out}/07-boss-intro-desktop.png`});
          await page.waitForFunction(()=>window.__pulseBossTopology&&window.__pulseAscent.boss?.__topologyRewriteInstalled===true,{timeout:8000});await page.waitForTimeout(750);
          const boss=await page.evaluate(()=>{const g=window.__pulseAscent,b=g.boss,t=window.__pulseBossTopology.stats();return{exists:!!b,visible:!document.querySelector('#bossHud').classList.contains('hidden'),parts:b?.parts.length||0,phase:b?.phase||0,health:b?.healthRatio?.()||0,section:document.querySelector('#sectionName').textContent,enemies:g.enemies.length,pilot:window.__pulsePilot.stats(),topology:t,shell:!!g.scene.getObjectByName('boss-topology-shell'),coreOpacity:b?.core?.material?.opacity??1};});
          if(!boss.exists||!boss.visible||boss.parts!==8||!boss.section.includes('CONVERGENCE')||boss.enemies!==0||!boss.pilot.humanoid||!boss.topology.patched||!boss.topology.shell||boss.topology.tethers<4||!boss.shell||boss.coreOpacity>.12)throw new Error(`Boss state invalid: ${JSON.stringify(boss)}`);
          await page.screenshot({path:`${out}/08-boss-topology-desktop.png`});await desktop.close();

          const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});const mp=await mobile.newPage();await attach(mp,'mobile');
          await mp.goto('http://127.0.0.1:4173/pulse-ascent/',{waitUntil:'networkidle'});await mp.screenshot({path:`${out}/09-start-mobile.png`});await mp.tap('#startBtn');await mp.waitForFunction(()=>window.__pulseAscent?.running===true,{timeout:12000});await mp.waitForFunction(()=>window.__pulsePilot?.rig&&window.__pulseExpansion?.assets?.ready===true&&window.__pulseTopologyWorlds?.worlds?.length===5&&window.__pulseAreaSetpieces,{timeout:15000});await mp.waitForTimeout(900);
          const mobileTopology=await mp.evaluate(()=>{const t=window.__pulseTopologyWorlds,w=t.worlds[t.area-1];return{visible:!!w?.root?.visible,segments:w?.totalSegments||0,packets:w?.packetCount||0,primitiveVisible:!!window.__pulseAscent.scene.getObjectByName('generative-architecture')?.visible};});
          if(!mobileTopology.visible||mobileTopology.primitiveVisible||mobileTopology.segments<70||mobileTopology.packets<20)throw new Error(`Mobile topology invalid: ${JSON.stringify(mobileTopology)}`);
          await mp.evaluate(()=>window.__pulseExpansion.startTestRupture());await mp.waitForTimeout(900);await mp.screenshot({path:`${out}/10-free-vector-mobile.png`,fullPage:true});
          const mobileState=await mp.evaluate(()=>({overflow:[document.documentElement.scrollWidth-innerWidth,document.documentElement.scrollHeight-innerHeight],hud:document.querySelector('#hud').getBoundingClientRect().toJSON(),controls:document.querySelector('#pilotControls').getBoundingClientRect().toJSON(),sync:document.querySelector('#sync').textContent,mode:window.__pulseExpansion?.state.mode,assets:window.__pulseExpansion?.assets.models.size,chip:document.querySelector('#modeChip')?.textContent,pilot:window.__pulsePilot.stats()}));
          if(mobileState.overflow[0]>1||mobileState.overflow[1]>1||mobileState.mode!=='rupture'||mobileState.assets<4||!mobileState.pilot.humanoid||mobileState.controls.right>390||mobileState.controls.left<0)throw new Error(`Mobile rupture invalid: ${JSON.stringify(mobileState)}`);await mobile.close();await browser.close();
          fs.writeFileSync(`${out}/state.json`,JSON.stringify({topology,setpiece,pilot,combat,threat,threatAfter,speedState,rupture,boss,mobileTopology,mobileState,errors},null,2));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log(JSON.stringify({topology,setpiece,pilot,combat,threat,threatAfter,speedState,rupture,boss,mobileTopology,mobileState},null,2));
          NODE
          node /tmp/pulse-gauntlet.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ascent-gauntlet
          path: pulse-ascent-gauntlet/
          if-no-files-found: warn
          retention-days: 7