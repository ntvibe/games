<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17131d" />
  <title>ntvibe games</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17131d;color:#fff}body{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 20% 10%,#3b2548 0,transparent 34%),radial-gradient(circle at 90% 80%,#25375b 0,transparent 35%),#17131d}.wrap{width:min(920px,100%)}h1{font-size:clamp(38px,8vw,78px);letter-spacing:-.06em;margin:0 0 10px}p{color:#c9bdcf;margin:0 0 30px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.game{display:block;position:relative;min-height:260px;padding:24px;border:1px solid rgba(255,255,255,.16);border-radius:28px;color:inherit;text-decoration:none;overflow:hidden;background:linear-gradient(145deg,#ffc8df,#c8b9ff);box-shadow:0 24px 70px rgba(0,0,0,.24);transition:transform .2s ease}.game:hover{transform:translateY(-5px)}.game:before{content:"✨";position:absolute;right:26px;top:24px;font-size:48px}.game small{display:block;color:#5e4568;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.game h2{margin:92px 0 7px;font-size:31px;letter-spacing:-.04em;color:#3f294a}.game span{color:#6d5674;font-weight:650}.note{margin-top:22px;color:#776d7f;font-size:13px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Games</h1>
    <p>Small browser games, each kept in its own folder.</p>
    <div class="grid">
      <a class="game" href="./makeup/">
        <small>Playable prototype</small>
        <h2>Magic Makeup Studio</h2>
        <span>18-step makeup, jewelry and styling game.</span>
      </a>
    </div>
    <div class="note">More games can be added beside <code>/makeup</code> without changing its code.</div>
  </main>
</body>
</html>
