<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Aether-9 Ship Lab</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Inter,system-ui,sans-serif;color:#111}canvas{display:block;width:100%;height:100%}.ui{position:fixed;left:12px;top:12px;z-index:2;padding:10px 12px;border:1px solid #d8d8d8;border-radius:12px;background:rgba(255,255,255,.9);box-shadow:0 8px 30px #0001}.title{font-size:11px;font-weight:900;letter-spacing:.14em}.sub{font-size:9px;color:#777;margin:4px 0 8px}.row{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid #ccc;background:#fff;color:#222;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800}button:active{background:#eee}.stats{position:fixed;right:10px;bottom:10px;font-size:9px;color:#777;background:#fff9;padding:6px 8px;border-radius:7px}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script></head><body>
<div class="ui"><div class="title">AETHER-9 // IMG2THREEJS SCULPT LAB</div><div class="sub">white studio inspection · drag to orbit · pinch/wheel zoom</div><div class="row"><button data-view="hero">3/4 HERO</button><button data-view="top">TOP</button><button data-view="side">SIDE</button><button data-view="rear">REAR</button></div></div><div class="stats" id="stats"></div><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {buildPlayerShip} from './models-v4.js';
const c=document.querySelector('#c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true,powerPreference:'high-performance'});r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.setPixelRatio(Math.min(devicePixelRatio,2));
const s=new THREE.Scene();s.background=new THREE.Color(0xffffff);const cam=new THREE.PerspectiveCamera(38,1,.05,100);const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;pm.dispose();s.add(new THREE.HemisphereLight(0xffffff,0x667080,1.8));const key=new THREE.DirectionalLight(0xffffff,4.2);key.position.set(-7,11,8);key.castShadow=true;s.add(key);const fill=new THREE.DirectionalLight(0xaecfff,2);fill.position.set(8,3,-6);s.add(fill);const rim=new THREE.DirectionalLight(0xffc9e8,1.4);rim.position.set(0,6,10);s.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.12}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.1;floor.receiveShadow=true;s.add(floor);
const ship=buildPlayerShip();ship.rotation.y=Math.PI;s.add(ship);const ctl=new OrbitControls(cam,c);ctl.enableDamping=true;ctl.target.set(0,0,0);ctl.minDistance=4;ctl.maxDistance=16;
const views={hero:[[6.8,4.6,7.5],[0,.1,0]],top:[[0,10,.01],[0,0,0]],side:[[9,.8,.01],[0,0,0]],rear:[[0,1.5,9],[0,0,.2]]};function view(k){const [p,t]=views[k];cam.position.set(...p);ctl.target.set(...t);ctl.update()}view('hero');document.querySelectorAll('button').forEach(b=>b.onclick=()=>view(b.dataset.view));
let meshes=0,tris=0;ship.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;tris+=g.index?g.index.count/3:(g.attributes.position?.count||0)/3}});document.querySelector('#stats').textContent=`${meshes} meshes · ~${Math.round(tris).toLocaleString()} tris`;
function resize(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);ctl.update();r.render(s,cam)}loop();
</script></body></html>
